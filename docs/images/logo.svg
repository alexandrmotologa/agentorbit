<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#161B2E" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070D" />
    </radialGradient>

    <!-- Core Orb Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Core Pupil Glow -->
    <radialGradient id="pupilGlow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <!-- Outer Orbit Ring Gradient -->
    <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="orbitGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="3" />

  <!-- Subtle Ambient Constellation Grid -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,6">
    <circle cx="256" cy="256" r="190" fill="none" />
    <circle cx="256" cy="256" r="145" fill="none" />
    <circle cx="256" cy="256" r="85" fill="none" />
    <line x1="256" y1="60" x2="256" y2="452" />
    <line x1="60" y1="256" x2="452" y2="256" />
  </g>

  <!-- Secondary Elliptical Orbit (Counter-Angle) -->
  <ellipse cx="256" cy="256" rx="180" ry="68" fill="none" stroke="url(#orbitGrad2)" stroke-width="2.5" transform="rotate(-35 256 256)" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Primary Outer Orbital Ring (Tilted) -->
  <ellipse cx="256" cy="256" rx="195" ry="76" fill="none" stroke="url(#orbitGrad1)" stroke-width="5" transform="rotate(28 256 256)" filter="url(#softGlow)" />

  <!-- Orbit Satellite Node 1 (Leading Trajectory) -->
  <g transform="rotate(28 256 256)">
    <!-- Satellite Path Point -->
    <circle cx="451" cy="256" r="10" fill="#38BDF8" filter="url(#neonGlow)" />
    <circle cx="451" cy="256" r="5" fill="#FFFFFF" />
    <!-- Node Sensor Rings -->
    <circle cx="451" cy="256" r="17" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2,3" opacity="0.7" />
  </g>

  <!-- Orbit Satellite Node 2 (Left Lower Trajectory) -->
  <g transform="rotate(28 256 256)">
    <circle cx="61" cy="256" r="8" fill="#A855F7" filter="url(#neonGlow)" />
    <circle cx="61" cy="256" r="4" fill="#FFFFFF" />
  </g>

  <!-- Orbit Satellite Node 3 (Perpendicular Counter Orbit) -->
  <g transform="rotate(-35 256 256)">
    <circle cx="436" cy="256" r="7" fill="#10B981" filter="url(#softGlow)" />
    <circle cx="436" cy="256" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Inner Aura Glow -->
  <circle cx="256" cy="256" r="75" fill="#6366F1" opacity="0.25" filter="url(#neonGlow)" />

  <!-- Central Autonomous Agent Core Sphere -->
  <circle cx="256" cy="256" r="64" fill="url(#coreGrad)" stroke="#1E1B4B" stroke-width="4" filter="url(#softGlow)" />

  <!-- Inner Cybernetic Lens / Sensor Aperture -->
  <circle cx="256" cy="256" r="42" fill="#090D1A" stroke="#38BDF8" stroke-width="2" />
  <circle cx="256" cy="256" r="32" fill="url(#pupilGlow)" />
  <circle cx="248" cy="248" r="8" fill="#FFFFFF" opacity="0.85" />

  <!-- Equatorial Horizon Flares -->
  <path d="M 120 256 L 192 256" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" opacity="0.8" />
  <path d="M 320 256 L 392 256" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)" opacity="0.8" />

  <!-- Orbital Status Telemetry Marks -->
  <circle cx="256" cy="115" r="3" fill="#38BDF8" opacity="0.9" />
  <circle cx="256" cy="397" r="3" fill="#A855F7" opacity="0.9" />
</svg>
